<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FocusHours</title>
  <style>
/* ============================================
   CSS Variables - Theme System
   ============================================ */
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f7;
  --bg-card: #ffffff;
  --text-primary: #1d1d1f;
  --text-secondary: #86868b;
  --accent: #007aff;
  --accent-light: #e3f2fd;
  --border: #d2d2d7;
  --success: #34c759;
  --warning: #ff9500;
  --danger: #ff3b30;
  --shadow: rgba(0, 0, 0, 0.1);
}

[data-theme="dark"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-card: #1f2940;
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --accent: #0a84ff;
  --accent-light: #1c3a5e;
  --border: #3a3a4a;
  --shadow: rgba(0, 0, 0, 0.3);
}

/* ============================================
   Base Styles
   ============================================ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================
   App Container
   ============================================ */
.app {
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============================================
   Header
   ============================================ */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
}

.header-btn {
  width: 40px;
  height: 40px;
  border: none;
  background: var(--bg-secondary);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: transform 0.2s, background 0.2s;
}

.header-btn:active {
  transform: scale(0.95);
}

.header-title {
  font-size: 17px;
  font-weight: 600;
}

/* ============================================
   Views Container
   ============================================ */
.view {
  display: none;
  flex: 1;
  flex-direction: column;
}

.view.active {
  display: flex;
}

/* ============================================
   Timer View
   ============================================ */
.timer-view {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.timer-display {
  text-align: center;
  padding: 40px 0;
}

.timer-time {
  font-size: 72px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
}

.timer-overtime {
  color: var(--success);
}

.timer-overtime::before {
  content: '+';
}

/* ============================================
   Mode Toggle
   ============================================ */
.mode-toggle {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.mode-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 15px;
  cursor: pointer;
  border-radius: 20px;
  transition: all 0.2s;
}

.mode-btn.active {
  background: var(--accent-light);
  color: var(--accent);
}

.mode-btn::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid currentColor;
}

.mode-btn.active::before {
  background: currentColor;
}

/* ============================================
   Countdown Settings
   ============================================ */
.countdown-settings {
  display: none;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.countdown-settings.visible {
  display: flex;
}

.countdown-input {
  width: 80px;
  padding: 10px;
  text-align: center;
  font-size: 24px;
  font-weight: 500;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--bg-secondary);
  color: var(--text-primary);
}

.countdown-label {
  color: var(--text-secondary);
  font-size: 15px;
}

/* ============================================
   Control Buttons
   ============================================ */
.controls {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 20px 0;
}

.control-btn {
  width: 80px;
  height: 80px;
  border: none;
  border-radius: 50%;
  font-size: 28px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.control-btn:active {
  transform: scale(0.95);
}

.control-btn.primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
}

.control-btn.secondary {
  background: var(--bg-secondary);
  color: var(--text-primary);
}

.control-btn.danger {
  background: var(--danger);
  color: white;
}

/* ============================================
   Flip Hint
   ============================================ */
.flip-hint {
  text-align: center;
  padding: 16px;
  margin: 20px 0;
  background: var(--bg-secondary);
  border-radius: 12px;
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.flip-hint.active {
  background: var(--accent-light);
  color: var(--accent);
}

.flip-icon {
  font-size: 20px;
}

/* ============================================
   Progress Section
   ============================================ */
.progress-section {
  margin-top: auto;
  padding: 20px;
  background: var(--bg-secondary);
  border-radius: 16px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.progress-hours {
  font-size: 18px;
  font-weight: 600;
}

.progress-percent {
  color: var(--text-secondary);
}

.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.3s;
}

.progress-estimate {
  color: var(--text-secondary);
  font-size: 14px;
  text-align: center;
}

/* ============================================
   Note Button
   ============================================ */
.note-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}

.note-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ============================================
   Stats View
   ============================================ */
.stats-view {
  padding: 20px;
  overflow-y: auto;
}

.stats-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stats-card-title {
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}

.stats-main {
  font-size: 32px;
  font-weight: 600;
  margin-bottom: 8px;
}

.stats-sub {
  color: var(--text-secondary);
  font-size: 14px;
}

/* ============================================
   Heatmap
   ============================================ */
.heatmap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.heatmap-day {
  aspect-ratio: 1;
  border-radius: 4px;
  background: var(--border);
}

.heatmap-day.level-1 { background: color-mix(in srgb, var(--accent) 25%, var(--bg-secondary)); }
.heatmap-day.level-2 { background: color-mix(in srgb, var(--accent) 50%, var(--bg-secondary)); }
.heatmap-day.level-3 { background: color-mix(in srgb, var(--accent) 75%, var(--bg-secondary)); }
.heatmap-day.level-4 { background: var(--accent); }

/* ============================================
   Tags List
   ============================================ */
.tags-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--bg-card);
  border-radius: 20px;
  font-size: 14px;
}

.tag-hours {
  color: var(--text-secondary);
}

/* ============================================
   History List
   ============================================ */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  background: var(--bg-card);
  border-radius: 12px;
}

.history-date {
  font-weight: 500;
}

.history-duration {
  color: var(--accent);
  font-weight: 600;
}

/* ============================================
   Settings View
   ============================================ */
.settings-view {
  padding: 20px;
  overflow-y: auto;
}

.settings-group {
  margin-bottom: 24px;
}

.settings-group-title {
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  padding-left: 4px;
}

.settings-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: var(--bg-secondary);
  border-radius: 12px;
  margin-bottom: 8px;
}

.settings-item:last-child {
  margin-bottom: 0;
}

.settings-label {
  font-size: 15px;
}

.settings-input {
  width: 100px;
  padding: 8px 12px;
  text-align: right;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 15px;
}

.settings-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 15px;
}

.settings-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.2s;
}

.settings-btn:active {
  transform: scale(0.98);
}

.settings-btn.primary {
  background: var(--accent);
  color: white;
}

.settings-btn.secondary {
  background: var(--bg-secondary);
  color: var(--text-primary);
}

/* ============================================
   Modal
   ============================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 420px;
  background: var(--bg-primary);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
}

.modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg-secondary);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
}

.note-textarea {
  width: 100%;
  height: 120px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 15px;
  resize: none;
  margin-bottom: 12px;
}

.tags-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 15px;
  margin-bottom: 16px;
}

.modal-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: white;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}

/* ============================================
   Current Notes Display
   ============================================ */
.current-notes {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg-card);
  border-radius: 12px;
  max-height: 150px;
  overflow-y: auto;
  display: none;
}

.current-notes.has-notes {
  display: block;
}

.current-note-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.current-note-item:last-child {
  border-bottom: none;
}

.current-note-tags {
  color: var(--accent);
  font-size: 12px;
  margin-top: 4px;
}
  </style>
</head>
<body>
  <div class="app">
    <!-- ============================================
         Timer View (Main)
         ============================================ -->
    <div id="timer-view" class="view active">
      <header class="header">
        <button class="header-btn" onclick="showView('settings')">⚙️</button>
        <span class="header-title">FocusHours</span>
        <button class="header-btn" onclick="showView('stats')">📊</button>
      </header>

      <div class="timer-view">
        <div class="timer-display">
          <div id="timer-time" class="timer-time">00:00:00</div>
        </div>

        <div class="mode-toggle">
          <button id="mode-stopwatch" class="mode-btn active" onclick="setMode('stopwatch')">正计时</button>
          <button id="mode-countdown" class="mode-btn" onclick="setMode('countdown')">倒计时</button>
        </div>

        <div id="countdown-settings" class="countdown-settings">
          <input type="number" id="countdown-minutes" class="countdown-input" value="25" min="1" max="180">
          <span class="countdown-label">分钟</span>
        </div>

        <div class="controls">
          <button id="btn-reset" class="control-btn secondary" onclick="resetTimer()" style="display: none;">↺</button>
          <button id="btn-main" class="control-btn primary" onclick="toggleTimer()">▶</button>
          <button id="btn-stop" class="control-btn danger" onclick="stopAndSave()" style="display: none;">■</button>
        </div>

        <div id="flip-hint" class="flip-hint">
          <span class="flip-icon">📱</span>
          <span id="flip-text">翻转手机开始计时</span>
        </div>

        <div id="current-notes" class="current-notes"></div>

        <button class="note-btn" onclick="showNoteModal()">
          <span>+</span>
          <span>添加备注</span>
        </button>

        <div class="progress-section">
          <div class="progress-header">
            <span id="progress-hours" class="progress-hours">0h / 500h</span>
            <span id="progress-percent" class="progress-percent">0%</span>
          </div>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <div id="progress-estimate" class="progress-estimate">开始记录你的专注时间吧</div>
        </div>
      </div>
    </div>

    <!-- ============================================
         Stats View
         ============================================ -->
    <div id="stats-view" class="view">
      <header class="header">
        <button class="header-btn" onclick="showView('timer')">←</button>
        <span class="header-title">进度详情</span>
        <div style="width: 40px;"></div>
      </header>

      <div class="stats-view">
        <div class="stats-card">
          <div class="stats-card-title">总进度</div>
          <div id="stats-main" class="stats-main">0h / 500h</div>
          <div class="progress-bar">
            <div id="stats-progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <div id="stats-sub" class="stats-sub">剩余 500 小时</div>
        </div>

        <div class="stats-card">
          <div class="stats-card-title">预计完成</div>
          <div id="stats-estimate" class="stats-main">-</div>
          <div id="stats-daily" class="stats-sub">日均 - 小时</div>
        </div>

        <div class="stats-card">
          <div class="stats-card-title">活动热力图</div>
          <div id="heatmap" class="heatmap"></div>
        </div>

        <div class="stats-card">
          <div class="stats-card-title">标签统计</div>
          <div id="tags-stats" class="tags-list"></div>
        </div>

        <div class="stats-card">
          <div class="stats-card-title">历史记录</div>
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </div>

    <!-- ============================================
         Settings View
         ============================================ -->
    <div id="settings-view" class="view">
      <header class="header">
        <button class="header-btn" onclick="showView('timer')">←</button>
        <span class="header-title">设置</span>
        <div style="width: 40px;"></div>
      </header>

      <div class="settings-view">
        <div class="settings-group">
          <div class="settings-group-title">目标设置</div>
          <div class="settings-item">
            <span class="settings-label">目标时长（小时）</span>
            <input type="number" id="setting-goal" class="settings-input" value="500" min="1" onchange="saveSettings()">
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">外观</div>
          <div class="settings-item">
            <span class="settings-label">主题</span>
            <select id="setting-theme" class="settings-select" onchange="saveSettings()">
              <option value="system">跟随系统</option>
              <option value="light">亮色</option>
              <option value="dark">暗色</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">翻转计时反馈</div>
          <div class="settings-item">
            <span class="settings-label">反馈方式</span>
            <select id="setting-flip-feedback" class="settings-select" onchange="saveSettings()">
              <option value="both">振动 + 语音</option>
              <option value="vibration">仅振动</option>
              <option value="voice">仅语音</option>
              <option value="none">静音</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">倒计时结束提醒</div>
          <div class="settings-item">
            <span class="settings-label">提醒方式</span>
            <select id="setting-end-reminder" class="settings-select" onchange="saveSettings()">
              <option value="all">声音 + 振动 + 通知</option>
              <option value="sound-vibration">声音 + 振动</option>
              <option value="sound">仅声音</option>
              <option value="vibration">仅振动</option>
              <option value="none">静音</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">数据管理</div>
          <button class="settings-btn secondary" onclick="exportData()" style="margin-bottom: 8px;">导出数据 (JSON)</button>
          <button class="settings-btn secondary" onclick="document.getElementById('import-file').click()">导入数据</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>

        <div class="settings-group">
          <div class="settings-group-title">关于</div>
          <div class="settings-item">
            <span class="settings-label">版本</span>
            <span style="color: var(--text-secondary);">1.0.0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================
       Note Modal
       ============================================ -->
  <div id="note-modal" class="modal-overlay" onclick="closeNoteModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">添加备注</span>
        <button class="modal-close" onclick="closeNoteModal()">×</button>
      </div>
      <textarea id="note-text" class="note-textarea" placeholder="记录你的学习内容..."></textarea>
      <input type="text" id="note-tags" class="tags-input" placeholder="标签（用空格分隔，如：英语 阅读）">
      <button class="modal-btn" onclick="saveNote()">保存备注</button>
    </div>
  </div>

  <script>
/* ============================================
   FocusHours - Core JavaScript
   ============================================ */

// ----------------------------------------
// Security: HTML Escape Utility
// ----------------------------------------
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ----------------------------------------
// State Management
// ----------------------------------------
const state = {
  mode: 'stopwatch',
  isRunning: false,
  startTime: null,
  elapsedSeconds: 0,
  countdownInitial: 25 * 60,
  isOvertime: false,
  currentNotes: [],
  isFlipped: false
};

// ----------------------------------------
// Data Storage
// ----------------------------------------
const STORAGE_KEY = 'focushours_data';

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    return {
      profile: { name: '', createdAt: new Date().toISOString() },
      goal: { targetHours: 500, startDate: new Date().toISOString().split('T')[0] },
      settings: {
        theme: 'system',
        flipFeedback: 'both',
        endReminder: 'all'
      },
      sessions: []
    };
  }
  return JSON.parse(raw);
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let appData = loadData();

// ----------------------------------------
// Theme Management
// ----------------------------------------
function applyTheme() {
  const theme = appData.settings.theme;
  if (theme === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (appData.settings.theme === 'system') applyTheme();
});

// ----------------------------------------
// View Navigation
// ----------------------------------------
function showView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewName + '-view').classList.add('active');

  if (viewName === 'stats') updateStats();
  if (viewName === 'settings') loadSettingsUI();
}

// ----------------------------------------
// Timer Mode
// ----------------------------------------
function setMode(mode) {
  state.mode = mode;
  document.getElementById('mode-stopwatch').classList.toggle('active', mode === 'stopwatch');
  document.getElementById('mode-countdown').classList.toggle('active', mode === 'countdown');
  document.getElementById('countdown-settings').classList.toggle('visible', mode === 'countdown');

  if (!state.isRunning) {
    state.elapsedSeconds = 0;
    state.isOvertime = false;
    updateTimerDisplay();
  }
}

// ----------------------------------------
// Timer Core
// ----------------------------------------
let timerInterval = null;

function toggleTimer() {
  if (state.isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (state.mode === 'countdown' && state.elapsedSeconds === 0) {
    state.countdownInitial = parseInt(document.getElementById('countdown-minutes').value) * 60;
  }

  state.isRunning = true;
  state.startTime = Date.now() - (state.elapsedSeconds * 1000);

  timerInterval = setInterval(updateTimer, 100);
  updateControlButtons();

  provideFeedback('start');
}

function pauseTimer() {
  state.isRunning = false;
  clearInterval(timerInterval);
  updateControlButtons();
}

function resetTimer() {
  pauseTimer();
  state.elapsedSeconds = 0;
  state.isOvertime = false;
  state.currentNotes = [];
  updateTimerDisplay();
  updateCurrentNotesDisplay();
  updateControlButtons();
}

function stopAndSave() {
  if (state.elapsedSeconds < 1) {
    resetTimer();
    return;
  }

  pauseTimer();

  const session = {
    id: 's_' + Date.now(),
    date: new Date().toISOString().split('T')[0],
    startTime: new Date(state.startTime).toISOString(),
    endTime: new Date().toISOString(),
    duration: Math.floor(state.elapsedSeconds),
    mode: state.mode,
    initialMinutes: state.mode === 'countdown' ? Math.floor(state.countdownInitial / 60) : null,
    notes: [...state.currentNotes]
  };

  appData.sessions.push(session);
  saveData(appData);

  provideFeedback('stop');

  state.elapsedSeconds = 0;
  state.isOvertime = false;
  state.currentNotes = [];
  updateTimerDisplay();
  updateCurrentNotesDisplay();
  updateControlButtons();
  updateProgress();
}

function updateTimer() {
  const now = Date.now();
  state.elapsedSeconds = (now - state.startTime) / 1000;

  if (state.mode === 'countdown' && !state.isOvertime) {
    if (state.elapsedSeconds >= state.countdownInitial) {
      state.isOvertime = true;
      triggerEndReminder();
    }
  }

  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-time');
  let displaySeconds;

  if (state.mode === 'countdown') {
    if (state.isOvertime) {
      displaySeconds = state.elapsedSeconds - state.countdownInitial;
      el.classList.add('timer-overtime');
    } else {
      displaySeconds = Math.max(0, state.countdownInitial - state.elapsedSeconds);
      el.classList.remove('timer-overtime');
    }
  } else {
    displaySeconds = state.elapsedSeconds;
    el.classList.remove('timer-overtime');
  }

  el.textContent = formatTime(displaySeconds);
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return h.toString().padStart(2, '0') + ':' +
         m.toString().padStart(2, '0') + ':' +
         s.toString().padStart(2, '0');
}

function updateControlButtons() {
  const btnMain = document.getElementById('btn-main');
  const btnReset = document.getElementById('btn-reset');
  const btnStop = document.getElementById('btn-stop');

  if (state.isRunning) {
    btnMain.textContent = '⏸';
    btnReset.style.display = 'none';
    btnStop.style.display = 'flex';
  } else if (state.elapsedSeconds > 0) {
    btnMain.textContent = '▶';
    btnReset.style.display = 'flex';
    btnStop.style.display = 'flex';
  } else {
    btnMain.textContent = '▶';
    btnReset.style.display = 'none';
    btnStop.style.display = 'none';
  }
}

// ----------------------------------------
// Visibility Change Handler
// ----------------------------------------
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.isRunning) {
    state.elapsedSeconds = (Date.now() - state.startTime) / 1000;
    updateTimerDisplay();
  }
});

// ----------------------------------------
// Flip Detection
// ----------------------------------------
let flipPermissionGranted = false;

async function requestFlipPermission() {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceMotionEvent.requestPermission();
      flipPermissionGranted = permission === 'granted';
    } catch (e) {
      console.log('Motion permission denied');
    }
  } else {
    flipPermissionGranted = true;
  }

  if (flipPermissionGranted) {
    window.addEventListener('deviceorientation', handleOrientation);
  }
}

function handleOrientation(event) {
  const beta = event.beta;
  if (beta === null) return;

  const isFaceDown = beta < -60 || beta > 120;

  if (isFaceDown && !state.isFlipped) {
    state.isFlipped = true;
    updateFlipHint(true);
    if (!state.isRunning) {
      startTimer();
    }
  } else if (!isFaceDown && state.isFlipped) {
    state.isFlipped = false;
    updateFlipHint(false);
    if (state.isRunning) {
      stopAndSave();
    }
  }
}

function updateFlipHint(isFlipped) {
  const hint = document.getElementById('flip-hint');
  const text = document.getElementById('flip-text');
  if (isFlipped) {
    hint.classList.add('active');
    text.textContent = '计时中...';
  } else {
    hint.classList.remove('active');
    text.textContent = '翻转手机开始计时';
  }
}

document.addEventListener('click', function initFlip() {
  if (!flipPermissionGranted) {
    requestFlipPermission();
  }
  document.removeEventListener('click', initFlip);
}, { once: true });

// ----------------------------------------
// Feedback (Vibration + Voice)
// ----------------------------------------
function provideFeedback(type) {
  const feedback = appData.settings.flipFeedback;
  if (feedback === 'none') return;

  const shouldVibrate = feedback === 'both' || feedback === 'vibration';
  const shouldSpeak = feedback === 'both' || feedback === 'voice';

  if (type === 'start') {
    if (shouldVibrate && navigator.vibrate) {
      navigator.vibrate([100, 50, 100]);
    }
    if (shouldSpeak) {
      speak('开始计时');
    }
  } else if (type === 'stop') {
    const minutes = Math.floor(state.elapsedSeconds / 60);
    if (shouldVibrate && navigator.vibrate) {
      navigator.vibrate(300);
    }
    if (shouldSpeak) {
      speak('计时结束，共 ' + minutes + ' 分钟');
    }
  }
}

function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 1.1;
    speechSynthesis.speak(utterance);
  }
}

// ----------------------------------------
// End Reminder
// ----------------------------------------
function triggerEndReminder() {
  const reminder = appData.settings.endReminder;
  if (reminder === 'none') return;

  if (reminder.includes('vibration') || reminder === 'all') {
    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200]);
    }
  }

  if (reminder.includes('sound') || reminder === 'all') {
    playNotificationSound();
  }

  if (reminder === 'all') {
    showNotification();
  }
}

function playNotificationSound() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();

  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);

  oscillator.frequency.value = 880;
  oscillator.type = 'sine';
  gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

  oscillator.start(audioContext.currentTime);
  oscillator.stop(audioContext.currentTime + 0.5);
}

function showNotification() {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('FocusHours', {
      body: '倒计时结束！继续加油 💪'
    });
  }
}

if ('Notification' in window && Notification.permission === 'default') {
  document.addEventListener('click', () => {
    Notification.requestPermission();
  }, { once: true });
}

// ----------------------------------------
// Notes
// ----------------------------------------
function showNoteModal() {
  document.getElementById('note-modal').classList.add('active');
  document.getElementById('note-text').focus();
}

function closeNoteModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('note-modal').classList.remove('active');
  document.getElementById('note-text').value = '';
  document.getElementById('note-tags').value = '';
}

function saveNote() {
  const text = document.getElementById('note-text').value.trim();
  const tagsRaw = document.getElementById('note-tags').value.trim();

  if (!text) {
    closeNoteModal();
    return;
  }

  const tags = tagsRaw ? tagsRaw.split(/\s+/).filter(t => t) : [];

  state.currentNotes.push({
    time: new Date().toISOString(),
    text: text,
    tags: tags
  });

  updateCurrentNotesDisplay();
  closeNoteModal();
}

function updateCurrentNotesDisplay() {
  const container = document.getElementById('current-notes');
  container.innerHTML = '';

  if (state.currentNotes.length === 0) {
    container.classList.remove('has-notes');
    return;
  }

  container.classList.add('has-notes');

  state.currentNotes.forEach(note => {
    const item = document.createElement('div');
    item.className = 'current-note-item';

    const textNode = document.createElement('span');
    textNode.textContent = note.text;
    item.appendChild(textNode);

    if (note.tags.length) {
      const tagsDiv = document.createElement('div');
      tagsDiv.className = 'current-note-tags';
      tagsDiv.textContent = '#' + note.tags.join(' #');
      item.appendChild(tagsDiv);
    }

    container.appendChild(item);
  });
}

// ----------------------------------------
// Progress Calculation
// ----------------------------------------
function updateProgress() {
  const totalSeconds = appData.sessions.reduce((sum, s) => sum + s.duration, 0);
  const totalHours = totalSeconds / 3600;
  const targetHours = appData.goal.targetHours;
  const percent = Math.min(100, (totalHours / targetHours) * 100);

  document.getElementById('progress-hours').textContent =
    totalHours.toFixed(1) + 'h / ' + targetHours + 'h';
  document.getElementById('progress-percent').textContent =
    percent.toFixed(1) + '%';
  document.getElementById('progress-fill').style.width = percent + '%';

  const estimate = calculateEstimate(totalHours, targetHours);
  document.getElementById('progress-estimate').textContent = estimate;
}

function calculateEstimate(totalHours, targetHours) {
  if (totalHours === 0) return '开始记录你的专注时间吧';
  if (totalHours >= targetHours) return '🎉 目标已完成！';

  const sessions = appData.sessions;
  const dates = [...new Set(sessions.map(s => s.date))];
  const dayCount = dates.length;
  const avgHoursPerDay = totalHours / dayCount;

  const remainingHours = targetHours - totalHours;
  const remainingDays = Math.ceil(remainingHours / avgHoursPerDay);

  const estimateDate = new Date();
  estimateDate.setDate(estimateDate.getDate() + remainingDays);

  const month = estimateDate.getMonth() + 1;
  const day = estimateDate.getDate();

  return '预计 ' + month + '月' + day + '日 完成';
}

// ----------------------------------------
// Stats View
// ----------------------------------------
function updateStats() {
  const totalSeconds = appData.sessions.reduce((sum, s) => sum + s.duration, 0);
  const totalHours = totalSeconds / 3600;
  const targetHours = appData.goal.targetHours;
  const percent = Math.min(100, (totalHours / targetHours) * 100);
  const remainingHours = Math.max(0, targetHours - totalHours);

  document.getElementById('stats-main').textContent =
    totalHours.toFixed(1) + 'h / ' + targetHours + 'h';
  document.getElementById('stats-progress-fill').style.width = percent + '%';
  document.getElementById('stats-sub').textContent =
    '剩余 ' + remainingHours.toFixed(1) + ' 小时';

  if (totalHours > 0 && totalHours < targetHours) {
    const dates = [...new Set(appData.sessions.map(s => s.date))];
    const avgHoursPerDay = totalHours / dates.length;
    const remainingDays = Math.ceil(remainingHours / avgHoursPerDay);

    const estimateDate = new Date();
    estimateDate.setDate(estimateDate.getDate() + remainingDays);

    document.getElementById('stats-estimate').textContent =
      (estimateDate.getMonth() + 1) + '月' + estimateDate.getDate() + '日';
    document.getElementById('stats-daily').textContent =
      '日均 ' + avgHoursPerDay.toFixed(1) + ' 小时';
  } else if (totalHours >= targetHours) {
    document.getElementById('stats-estimate').textContent = '已完成 🎉';
    document.getElementById('stats-daily').textContent = '';
  } else {
    document.getElementById('stats-estimate').textContent = '-';
    document.getElementById('stats-daily').textContent = '日均 - 小时';
  }

  updateHeatmap();
  updateTagsStats();
  updateHistory();
}

function updateHeatmap() {
  const container = document.getElementById('heatmap');
  container.innerHTML = '';

  const today = new Date();
  const days = [];

  for (let i = 34; i >= 0; i--) {
    const date = new Date(today);
    date.setDate(date.getDate() - i);
    days.push(date.toISOString().split('T')[0]);
  }

  const hoursPerDay = {};
  appData.sessions.forEach(s => {
    hoursPerDay[s.date] = (hoursPerDay[s.date] || 0) + s.duration / 3600;
  });

  days.forEach(date => {
    const hours = hoursPerDay[date] || 0;
    let level = 0;
    if (hours > 0) level = 1;
    if (hours >= 1) level = 2;
    if (hours >= 2) level = 3;
    if (hours >= 3) level = 4;

    const dayEl = document.createElement('div');
    dayEl.className = 'heatmap-day level-' + level;
    dayEl.title = date + ': ' + hours.toFixed(1) + 'h';
    container.appendChild(dayEl);
  });
}

function updateTagsStats() {
  const container = document.getElementById('tags-stats');
  container.innerHTML = '';

  const tagHours = {};
  appData.sessions.forEach(s => {
    s.notes.forEach(n => {
      n.tags.forEach(tag => {
        tagHours[tag] = (tagHours[tag] || 0) + s.duration / 3600;
      });
    });
  });

  const sorted = Object.entries(tagHours).sort((a, b) => b[1] - a[1]);

  if (sorted.length === 0) {
    const placeholder = document.createElement('span');
    placeholder.style.color = 'var(--text-secondary)';
    placeholder.textContent = '暂无标签数据';
    container.appendChild(placeholder);
    return;
  }

  sorted.forEach(([tag, hours]) => {
    const item = document.createElement('div');
    item.className = 'tag-item';

    const tagName = document.createElement('span');
    tagName.textContent = '#' + tag;
    item.appendChild(tagName);

    const tagHrs = document.createElement('span');
    tagHrs.className = 'tag-hours';
    tagHrs.textContent = hours.toFixed(1) + 'h';
    item.appendChild(tagHrs);

    container.appendChild(item);
  });
}

function updateHistory() {
  const container = document.getElementById('history-list');
  container.innerHTML = '';

  const byDate = {};
  appData.sessions.forEach(s => {
    byDate[s.date] = (byDate[s.date] || 0) + s.duration;
  });

  const sorted = Object.entries(byDate).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 10);

  if (sorted.length === 0) {
    const placeholder = document.createElement('span');
    placeholder.style.color = 'var(--text-secondary)';
    placeholder.textContent = '暂无记录';
    container.appendChild(placeholder);
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  sorted.forEach(([date, seconds]) => {
    let label = date;
    if (date === today) label = '今天';
    else if (date === yesterday) label = '昨天';

    const item = document.createElement('div');
    item.className = 'history-item';

    const dateSpan = document.createElement('span');
    dateSpan.className = 'history-date';
    dateSpan.textContent = label;
    item.appendChild(dateSpan);

    const durationSpan = document.createElement('span');
    durationSpan.className = 'history-duration';
    durationSpan.textContent = (seconds / 3600).toFixed(1) + 'h';
    item.appendChild(durationSpan);

    container.appendChild(item);
  });
}

// ----------------------------------------
// Settings
// ----------------------------------------
function loadSettingsUI() {
  document.getElementById('setting-goal').value = appData.goal.targetHours;
  document.getElementById('setting-theme').value = appData.settings.theme;
  document.getElementById('setting-flip-feedback').value = appData.settings.flipFeedback;
  document.getElementById('setting-end-reminder').value = appData.settings.endReminder;
}

function saveSettings() {
  appData.goal.targetHours = parseInt(document.getElementById('setting-goal').value) || 500;
  appData.settings.theme = document.getElementById('setting-theme').value;
  appData.settings.flipFeedback = document.getElementById('setting-flip-feedback').value;
  appData.settings.endReminder = document.getElementById('setting-end-reminder').value;

  saveData(appData);
  applyTheme();
  updateProgress();
}

// ----------------------------------------
// Data Export/Import
// ----------------------------------------
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'focushours-backup-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.sessions && imported.goal && imported.settings) {
        appData = imported;
        saveData(appData);
        applyTheme();
        updateProgress();
        loadSettingsUI();
        alert('数据导入成功！');
      } else {
        alert('无效的数据文件');
      }
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ----------------------------------------
// Initialize
// ----------------------------------------
function init() {
  applyTheme();
  updateProgress();
  updateControlButtons();
}

init();
  </script>
